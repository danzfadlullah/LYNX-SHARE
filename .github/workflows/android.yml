name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'resources/android/**'
      - 'scripts/build-android.sh'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'resources/android/**'
      - 'scripts/build-android.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-android
          key: cmake-android-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**') }}
          restore-keys: cmake-android-${{ runner.os }}-

      - name: Configure CMake for Android
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DLYNX_BUILD_APP=ON \
            -DLYNX_BUILD_PLUGINS=OFF \
            -DLYNX_LTO=OFF \
            -DLYNX_PATCH_JUCE=ON

      - name: Build Android (Release)
        run: |
          cmake --build build-android --target LYNX -- -j$(nproc)

      - name: Package APK
        run: |
          cmake --build build-android --target LYNX_install

      - name: Package AAB
        run: |
          cmake --build build-android --target LYNX_bundle

      - name: Find artifacts
        id: artifacts
        run: |
          APK=$(find build-android -name "*.apk" -type f | head -1)
          AAB=$(find build-android -name "*.aab" -type f | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "aab=$AAB" >> $GITHUB_OUTPUT
          ls -la $APK $AAB 2>/dev/null || true

      - name: Upload APK
        if: steps.artifacts.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: lynx-android-apk
          path: ${{ steps.artifacts.outputs.apk }}
          retention-days: 30

      - name: Upload AAB
        if: steps.artifacts.outputs.aab != ''
        uses: actions/upload-artifact@v4
        with:
          name: lynx-android-aab
          path: ${{ steps.artifacts.outputs.aab }}
          retention-days: 30

      - name: Build info
        run: |
          echo "Build completed successfully"
          echo "APK: ${{ steps.artifacts.outputs.apk }}"
          echo "AAB: ${{ steps.artifacts.outputs.aab }}"
          if [ -f "${{ steps.artifacts.outputs.apk }}" ]; then
            echo "APK size: $(du -h ${{ steps.artifacts.outputs.apk }} | cut -f1)"
          fi
          if [ -f "${{ steps.artifacts.outputs.aab }}" ]; then
            echo "AAB size: $(du -h ${{ steps.artifacts.outputs.aab }} | cut -f1)"
          fi